<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>26光电2班 · 课程表</title>
    <style>
        :root {
            --bg: #f0f4f9;
            --card: #ffffff;
            --text: #0b1a33;
            --muted: #5b6f8c;
            --line: #dce2ec;
            --accent: #1f5fcf;
            --accent-light: #e8edfb;
            --shadow: 0 6px 24px rgba(0, 20, 50, 0.08);
            --radius: 18px;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            padding: 0 0 80px 0;
            min-height: 100vh;
            line-height: 1.5;
        }

        /* 顶部 */
        .header {
            background: linear-gradient(135deg, #0b2a5e, #1f5fcf);
            color: #fff;
            padding: 20px 24px 18px;
            border-radius: 0 0 32px 32px;
            box-shadow: 0 8px 30px rgba(31, 95, 207, 0.25);
        }
        .header .sub-title {
            font-size: 14px;
            font-weight: 400;
            opacity: 0.85;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin: 0 0 2px;
        }
        .header .greeting {
            font-size: 15px;
            font-weight: 500;
            margin: 6px 0 2px;
            opacity: 0.95;
        }
        .header .ai-message {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 4px;
            font-weight: 400;
            background: rgba(255,255,255,0.12);
            padding: 6px 12px;
            border-radius: 12px;
            display: inline-block;
            backdrop-filter: blur(4px);
        }
        .header .info-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 28px;
            margin-top: 12px;
            font-size: 15px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.12);
            padding: 12px 18px;
            border-radius: 14px;
            backdrop-filter: blur(6px);
        }
        .header .info-row span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header .info-row .badge {
            background: #fbbf24;
            color: #0b2a5e;
            padding: 0 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 18px 18px 0;
        }

        /* 今日课程 */
        .today-section {
            margin-top: 6px;
        }
        .today-section .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .today-section .section-title small {
            font-size: 14px;
            font-weight: 400;
            color: var(--muted);
        }

        .course-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .course-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px 20px;
            box-shadow: var(--shadow);
            border-left: 5px solid var(--line);
            transition: all 0.2s;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 18px;
        }
        .course-card .main {
            flex: 1;
            min-width: 180px;
        }
        .course-card .main .name {
            font-weight: 700;
            font-size: 17px;
        }
        .course-card .main .meta {
            font-size: 14px;
            color: var(--muted);
            margin-top: 2px;
        }
        .course-card .main .meta .sep {
            margin: 0 6px;
            color: #c5d0df;
        }
        .course-card .time-tag {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-light);
            padding: 4px 14px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .course-card .status-tag {
            font-size: 13px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .status-tag.ongoing {
            background: #dcfce7;
            color: #15803d;
        }
        .status-tag.past {
            background: #f1f3f6;
            color: #8a9bb0;
        }
        .status-tag.upcoming {
            background: #fef9c3;
            color: #a16207;
        }
        .status-tag.none {
            background: #f1f3f6;
            color: #8a9bb0;
        }

        /* 进度标签 */
        .progress-tag {
            font-size: 13px;
            color: var(--muted);
            background: #f1f5f9;
            padding: 2px 12px;
            border-radius: 999px;
            white-space: nowrap;
            font-weight: 500;
        }

        /* 进行中放大 */
        .course-card.ongoing-card {
            border-left-color: #15803d;
            background: #f0fdf4;
            transform: scale(1.02);
            box-shadow: 0 8px 32px rgba(21, 128, 61, 0.15);
            padding: 22px 24px;
        }
        .course-card.ongoing-card .main .name {
            font-size: 20px;
        }

        /* 已过去缩小 */
        .course-card.past-card {
            border-left-color: #cbd5e1;
            opacity: 0.7;
            padding: 10px 16px;
        }
        .course-card.past-card .main .name {
            font-size: 15px;
            font-weight: 600;
        }
        .course-card.past-card .main .meta {
            font-size: 13px;
        }

        .no-course {
            background: var(--card);
            border-radius: var(--radius);
            padding: 40px 24px;
            text-align: center;
            color: var(--muted);
            box-shadow: var(--shadow);
        }

        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            border-top: 1px solid var(--line);
            display: flex;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.04);
        }
        .bottom-nav .tab {
            flex: 1;
            text-align: center;
            padding: 14px 0 12px;
            font-weight: 600;
            font-size: 16px;
            color: var(--muted);
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 3px solid transparent;
            user-select: none;
        }
        .bottom-nav .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: var(--accent-light);
        }
        .bottom-nav .tab:hover {
            background: #f8faff;
        }

        /* 所有课程面板 */
        .all-panel {
            display: none;
            margin-top: 6px;
        }
        .all-panel.open {
            display: block;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px 20px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            align-items: center;
        }
        .filters label {
            font-size: 14px;
            font-weight: 600;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .filters select {
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: #fff;
            font-size: 14px;
            color: var(--text);
            min-width: 110px;
            outline: none;
            cursor: pointer;
        }
        .filters select:focus {
            border-color: var(--accent);
        }
        .filters .reset-btn {
            background: var(--accent-light);
            color: var(--accent);
            border: none;
            padding: 6px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-left: auto;
        }
        .filters .reset-btn:hover {
            background: #d6e2f5;
        }

        .table-wrap {
            overflow-x: auto;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }
        .table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 780px;
        }
        .table-wrap th {
            background: #f8faff;
            padding: 12px 14px;
            text-align: left;
            font-weight: 700;
            color: var(--text);
            border-bottom: 2px solid var(--line);
            white-space: nowrap;
        }
        .table-wrap td {
            padding: 11px 14px;
            border-bottom: 1px solid var(--line);
            vertical-align: middle;
        }
        .table-wrap tr:last-child td {
            border-bottom: none;
        }
        .table-wrap tr:hover td {
            background: #fafcff;
        }
        .table-wrap .week-badge {
            font-size: 12px;
            background: #eef2f7;
            padding: 2px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .table-wrap .loc {
            font-size: 13px;
            color: var(--muted);
        }

        /* 星期汇总表格 */
        .week-summary {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px 20px;
            margin-top: 8px;
        }
        .week-summary h3 {
            font-size: 18px;
            margin: 0 0 12px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .week-summary table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .week-summary th {
            background: #f8faff;
            padding: 10px 12px;
            text-align: left;
            font-weight: 700;
            border-bottom: 2px solid var(--line);
            width: 80px;
        }
        .week-summary td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
        }
        .week-summary tr:last-child td {
            border-bottom: none;
        }
        .week-summary .day-cell {
            font-weight: 700;
            color: var(--accent);
        }
        .week-summary .course-item {
            display: inline-block;
            background: #f8faff;
            border-radius: 8px;
            padding: 4px 12px 4px 10px;
            margin: 3px 6px 3px 0;
            border-left: 3px solid var(--accent);
            font-size: 13px;
            white-space: nowrap;
        }
        .week-summary .course-item .time {
            font-weight: 600;
            color: var(--text);
        }
        .week-summary .course-item .info {
            color: var(--muted);
        }
        .week-summary .empty-day {
            color: var(--muted);
            font-style: italic;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }

        /* 底部说明 */
        .footer-note {
            margin-top: 24px;
            font-size: 12px;
            color: var(--muted);
            padding: 12px 0 4px;
            border-top: 1px solid var(--line);
            text-align: center;
        }

        /* 设置弹窗 */
        .settings-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .settings-overlay.open {
            display: flex;
        }
        .settings-box {
            background: #fff;
            border-radius: 24px;
            padding: 32px 28px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: fadeIn 0.25s ease;
        }
        .settings-box h3 {
            font-size: 20px;
            margin: 0 0 12px;
        }
        .settings-box label {
            display: block;
            font-weight: 600;
            margin: 12px 0 4px;
            font-size: 14px;
            color: var(--muted);
        }
        .settings-box input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }
        .settings-box input:focus {
            border-color: var(--accent);
        }
        .settings-box .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .settings-box .actions button {
            padding: 8px 18px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        .settings-box .actions .save-btn {
            background: var(--accent);
            color: #fff;
        }
        .settings-box .actions .cancel-btn {
            background: #f1f3f6;
            color: var(--text);
        }
        .settings-box .actions .ai-btn {
            background: #10a37f;
            color: #fff;
            margin-right: auto;
        }
        .settings-box .actions .export-btn {
            background: #6b7280;
            color: #fff;
        }
        .settings-box .hint {
            font-size: 13px;
            color: var(--muted);
            margin: 6px 0 0;
        }
        .settings-box .api-status {
            font-size: 13px;
            margin: 4px 0 0;
            color: var(--accent);
        }

        /* 响应式 */
        @media (max-width: 700px) {
            .header h1 {
                font-size: 20px;
            }
            .header .sub-title {
                font-size: 12px;
            }
            .header .greeting {
                font-size: 14px;
            }
            .header .ai-message {
                font-size: 12px;
                padding: 4px 10px;
            }
            .header .info-row {
                font-size: 13px;
                padding: 10px 14px;
                gap: 8px 16px;
            }
            .course-card {
                padding: 12px 14px;
                gap: 6px 12px;
            }
            .course-card .main .name {
                font-size: 15px;
            }
            .course-card.ongoing-card .main .name {
                font-size: 17px;
            }
            .course-card.past-card .main .name {
                font-size: 13px;
            }
            .filters {
                padding: 12px 14px;
                gap: 8px 10px;
            }
            .filters select {
                min-width: 80px;
                font-size: 13px;
                padding: 4px 8px;
            }
            .bottom-nav .tab {
                font-size: 14px;
                padding: 12px 0 10px;
            }
            .table-wrap table {
                font-size: 13px;
                min-width: 640px;
            }
            .table-wrap th,
            .table-wrap td {
                padding: 8px 10px;
            }
            .week-summary {
                padding: 12px 14px;
            }
            .week-summary table {
                font-size: 13px;
            }
            .week-summary th {
                width: 60px;
                padding: 8px 8px;
            }
            .week-summary td {
                padding: 8px 8px;
            }
            .week-summary .course-item {
                font-size: 12px;
                padding: 2px 8px;
                margin: 2px 4px 2px 0;
                white-space: normal;
            }
            .settings-box {
                padding: 24px 20px;
            }
            .progress-tag {
                font-size: 12px;
                padding: 2px 8px;
            }
            .settings-box .actions button {
                font-size: 13px;
                padding: 6px 14px;
            }
        }
        @media (max-width: 420px) {
            .header {
                padding: 14px 14px 12px;
            }
            .header h1 {
                font-size: 17px;
            }
            .container {
                padding: 10px 10px 0;
            }
            .course-card .main .meta {
                font-size: 12px;
            }
            .course-card .time-tag {
                font-size: 12px;
                padding: 2px 10px;
            }
            .course-card .status-tag {
                font-size: 11px;
                padding: 2px 10px;
            }
            .week-summary .course-item {
                font-size: 11px;
                padding: 2px 6px;
            }
            .progress-tag {
                font-size: 11px;
                padding: 2px 6px;
            }
        }

        /* 动画 */
        .fade-in {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- ===== 顶部 ===== -->
    <header class="header">
        <div class="sub-title">河北大学26级大一光电2班课程安排表</div>
        <h1>📘 2026–2027学年秋（三学期）</h1>
        <div class="greeting" id="greetingText">——</div>
        <div class="ai-message" id="aiMessage">✨ 加载 AI 建议…</div>
        <div class="info-row">
            <span id="todayDisplay">📅 加载中…</span>
            <span id="weekDisplay">📆 计算周次…</span>
            <span id="statusSummary" class="badge">● 今日课程</span>
        </div>
    </header>

    <!-- ===== 主区域 ===== -->
    <div class="container">

        <!-- 今日课程 -->
        <section class="today-section" id="todayPanel">
            <div class="section-title">
                📌 今日课程
                <small id="todaySub">加载中…</small>
            </div>
            <div id="todayList" class="course-list fade-in">
                <!-- 由 JS 渲染 -->
            </div>
        </section>

        <!-- 所有课程 -->
        <section class="all-panel" id="allPanel">
            <div class="section-title" style="margin-bottom:14px;">
                📋 全部课程
                <small>共 <span id="totalCount">0</span> 门</small>
            </div>

            <div class="filters">
                <label>👨‍🏫 老师
                    <select id="filterTeacher"><option value="">全部</option></select>
                </label>
                <label>🏫 地点
                    <select id="filterBuilding"><option value="">全部</option></select>
                </label>
                <label>📖 科目
                    <select id="filterSubject"><option value="">全部</option></select>
                </label>
                <button class="reset-btn" id="resetFilters">↻ 重置</button>
            </div>

            <!-- 列表视图 -->
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>星期</th>
                            <th>时间</th>
                            <th>课程</th>
                            <th>教师</th>
                            <th>周次</th>
                            <th>地点</th>
                        </tr>
                    </thead>
                    <tbody id="allTableBody">
                        <!-- 由 JS 渲染 -->
                    </tbody>
                </table>
            </div>

            <!-- 按星期汇总 -->
            <div class="week-summary" id="weekSummary">
                <h3>📅 按星期汇总（全部课程）</h3>
                <div id="weekSummaryTable">
                    <!-- 由 JS 渲染 -->
                </div>
            </div>
        </section>

        <div class="footer-note">
            📍 数据依据：26光电2班 2026-2027学年秋（三学期）课表 · 第一周从2026年8月31日开始
            <br>以教务系统最终安排为准
        </div>
    </div>

    <!-- ===== 底部导航 ===== -->
    <nav class="bottom-nav">
        <div class="tab active" data-tab="today">📖 当日课程</div>
        <div class="tab" data-tab="all">📋 所有课程</div>
        <div class="tab" data-tab="settings">⚙️ 设置</div>
    </nav>

    <!-- ===== 设置弹窗 ===== -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-box">
            <h3>⚙️ 设置</h3>
            <label for="nameInput">您的称呼</label>
            <input type="text" id="nameInput" placeholder="输入您的名字" />

            <label for="apiKeyInput">DeepSeek API Key (可选)</label>
            <input type="text" id="apiKeyInput" placeholder="sk-..." />
            <div class="hint">输入 API Key 后可生成更智能的每日建议，留空则使用本地模拟。</div>
            <div class="api-status" id="apiStatus">⏳ 未启用</div>

            <div class="actions">
                <button class="ai-btn" id="generateAiBtn">🤖 生成 AI 建议</button>
                <button class="export-btn" id="exportDataBtn">📥 导出数据</button>
                <button class="cancel-btn" id="settingsCancel">取消</button>
                <button class="save-btn" id="settingsSave">保存</button>
            </div>
        </div>
    </div>

    <script>
        // =====================================================
        //  1. 课程数据（已根据要求修改星期日 1-3周 实验室安全基础的时间为14:30-17:05）
        // =====================================================
        const rawCourses = [
            // 周一 (day=1)
            { day: 1, start: '10:20', end: '12:00', name: '大学计算机与人工智能C_20', teacher: '尹胜彬',
                weeks: '1–10周', location: '五四路校区第七教学楼301' },
            { day: 1, start: '14:30', end: '16:10', name: '普通物理实验1_03', teacher: '郝晓辉、赵磊、庞学霞、周阳',
                weeks: '4–16周', location: '五四路校区物理楼五楼东侧' },
            { day: 1, start: '16:20', end: '18:00', name: '大学计算机与人工智能C_20', teacher: '尹胜彬',
                weeks: '1–17周', location: '五四路校区主楼208(1)' },
            { day: 1, start: '19:00', end: '20:40', name: '大学数学C（高等数学-1）_06', teacher: '武利平',
                weeks: '1–15周', location: '五四路校区第七教学楼202' },
            // 周二 (day=2)
            { day: 2, start: '08:20', end: '10:00', name: '大学体育1：排球基础、校操与游泳_316', teacher: '体研2',
                weeks: '1–17周', location: '五四路校区虚拟教室场地1' },

        const dayNames = ['日', '一', '二', '三', '四', '五', '六'];

        // =====================================================
        //  2. 工具函数
        // =====================================================

        // 解析周次字符串 -> [[start,end], ...]
        function parseWeeks(str) {
            const parts = str.replace(/周/g, '').split(/[、，,，]/);
            const ranges = [];
            for (const p of parts) {
                const trimmed = p.trim();
                if (!trimmed) continue;
                if (trimmed.includes('-') || trimmed.includes('–') || trimmed.includes('—')) {
                    const [a, b] = trimmed.split(/[-–—]/).map(s => parseInt(s.trim(), 10));
                    if (!isNaN(a) && !isNaN(b)) ranges.push([a, b]);
                } else {
                    const n = parseInt(trimmed, 10);
                    if (!isNaN(n)) ranges.push([n, n]);
                }
            }
            return ranges;
        }

        // 判断当前周是否在周次范围内
        function isWeekInRanges(week, ranges) {
            return ranges.some(([s, e]) => week >= s && week <= e);
        }

        // 提取教学楼（去掉教室号）
        function extractBuilding(loc) {
            const patterns = [
                /(五四路校区[^\d]*?教学楼)/,
                /(五四路校区[^\d]*?楼)/,
                /(一路校区[^\d]*?虚拟教室)/,
                /(五四路校区[^\d]*?虚拟教室)/,
                /(五四路校区[^\d]*?主楼)/,
                /(五四路校区[^\d]*?物理楼)/,
                /(五四路校区[^\d]*?综合教学楼)/,
            ];
            for (const pat of patterns) {
                const m = loc.match(pat);
                if (m) return m[1].trim();
            }
            if (loc.length > 10) return loc.slice(0, 10);
            return loc;
        }

        // 提取科目（去掉下划线及后缀）
        function extractSubject(name) {
            return name.replace(/_[^_]*$/, '').trim();
        }

        // 解析时间 "HH:MM" -> 分钟数
        function timeToMin(t) {
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        }

        // 获取当前周次（第一周从2026-08-31开始）
        function getCurrentWeek() {
            const start = new Date(2026, 7, 31);
            const now = new Date();
            const diff = now - start;
            if (diff < 0) return 0;
            return Math.floor(diff / (7 * 24 * 60 * 60 * 1000)) + 1;
        }

        // 获取当前星期 (1=周一, 7=周日)
        function getCurrentDay() {
            const d = new Date().getDay();
            return d === 0 ? 7 : d;
        }

        // 格式化日期
        function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}年${m}月${d}日`;
        }

        // 判断课程状态
        function getCourseStatus(course, now) {
            const startMin = timeToMin(course.start);
            const endMin = timeToMin(course.end);
            const curMin = now.getHours() * 60 + now.getMinutes();
            if (curMin >= startMin && curMin < endMin) return 'ongoing';
            if (curMin >= endMin) return 'past';
            return 'upcoming';
        }

        function getGreeting() {
            const h = new Date().getHours();
            if (h >= 6 && h < 11) return '早上好';
            if (h >= 11 && h < 13) return '中午好';
            if (h >= 13 && h < 18) return '下午好';
            return '晚上好';
        }

        // 生成 AI 建议（模拟或真实调用）
        async function generateAiSuggestion() {
            const now = new Date();
            const h = now.getHours();
            const name = getUserName();
            const week = getCurrentWeek();
            const day = getCurrentDay();
            const dayName = '星期' + dayNames[day % 7];

            // 获取今日课程列表（用于提示）
            const todayCourses = allCourses.filter(c => c.day === day && isWeekInRanges(week, c.weekRanges));
            const courseNames = todayCourses.map(c => c.name).join('、') || '无课程';

            let prompt = '';
            let timeLabel = '';
            if (h >= 6 && h < 12) {
                timeLabel = '早晨';
                prompt = `现在是${timeLabel}，${dayName}，第${week}周。今日课程有：${courseNames}。请给出一段早晨问候，包含课程提示和一句激励话语。`;
            } else if (h >= 12 && h < 17) {
                timeLabel = '下午';
                prompt = `现在是${timeLabel}，${dayName}，第${week}周。今日课程有：${courseNames}。请给出下午课程提示和一句激励话语。`;
            } else {
                timeLabel = '晚上';
                prompt = `现在是${timeLabel}，${dayName}，第${week}周。今日课程有：${courseNames}。请对今日课程做一个小结，并给出鼓励话语。`;
            }

            // 检查是否有 API Key
            const apiKey = getApiKey();
            let aiText = '';

            if (apiKey) {
                // 尝试真实调用 DeepSeek API
                try {
                    const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: 'deepseek-chat',
                            messages: [
                                { role: 'system', content: '你是一个智能课程助手，用亲切、鼓励的口吻回答，保持简洁（30字以内）。' },
                                { role: 'user', content: prompt }
                            ],
                            max_tokens: 60,
                            temperature: 0.7
                        })
                    });
                    if (!response.ok) throw new Error('API 请求失败');
                    const data = await response.json();
                    aiText = data.choices[0].message.content.trim();
                } catch (e) {
                    console.warn('DeepSeek API 调用失败，使用本地模拟:', e);
                    aiText = generateLocalSuggestion(timeLabel, courseNames);
                }
            } else {
                aiText = generateLocalSuggestion(timeLabel, courseNames);
            }

            document.getElementById('aiMessage').textContent = '💡 ' + aiText;
            return aiText;
        }

        // =====================================================

        // 7.1 渲染今日课程（含进度信息）
        function renderToday() {
            const now = new Date();
            const week = getCurrentWeek();
            const day = getCurrentDay();

            const dayIndex = day % 7;
            document.getElementById('todayDisplay').textContent =
                `📅 ${formatDate(now)} · 星期${dayNames[dayIndex]}`;
            document.getElementById('weekDisplay').textContent =
                `📆 第 ${week} 周（2026-08-31 起）`;
            todaySubEl.textContent = `星期${dayNames[dayIndex]} · 第 ${week} 周`;

            // 筛选今日课程
            let todayCourses = allCourses.filter(c => {
                if (c.day !== day) return false;
                return isWeekInRanges(week, c.weekRanges);
            });

            todayCourses.sort((a, b) => timeToMin(a.start) - timeToMin(b.start));

            if (todayCourses.length === 0) {
                todayListEl.innerHTML = `
                    <div class="no-course">
                        🕊️ 今日暂无课程安排
                        <div style="margin-top:6px;font-size:13px;">第 ${week} 周 · 星期${dayNames[dayIndex]}</div>
                    </div>
                `;
                document.getElementById('statusSummary').textContent = '⏸️ 今日无课';
                return;
            }

            let html = '';
            const nowMin = now.getHours() * 60 + now.getMinutes();
            const cards = todayCourses.map(c => {
                const status = getCourseStatus(c, now);
                return { ...c, status };
            });

            const allPast = cards.every(c => c.status === 'past');
            document.getElementById('statusSummary').textContent = allPast ? '✅ 今日课程已全部结束' : '● 今日有课';

            for (const c of cards) {
                const status = c.status;
                let cardClass = 'course-card';
                let statusLabel = '';
                let statusClass = '';
                let progressText = '';

                const startMin = timeToMin(c.start);
                const endMin = timeToMin(c.end);

                if (status === 'ongoing') {
                    cardClass += ' ongoing-card';
                    statusLabel = '● 进行中';
                    statusClass = 'ongoing';
                    const diff = nowMin - startMin;
                    progressText = `⏱ 已进行 ${diff} 分钟`;
                } else if (status === 'past') {
                    cardClass += ' past-card';
                    statusLabel = '✓ 已结束';
                    statusClass = 'past';
                    const diff = nowMin - endMin;
                    progressText = `⏱ 已结束 ${diff} 分钟`;
                } else {
                    statusLabel = '⏳ 未开始';
                    statusClass = 'upcoming';
                    const diff = startMin - nowMin;
                    progressText = `⏱ 距开始还有 ${diff} 分钟`;
                }

                html += `
                    <div class="${cardClass} fade-in">
                        <div class="main">
                            <div class="name">${c.name}</div>
                            <div class="meta">
                                ${c.teacher}

                        </div>
                        <div class="time-tag">${c.timeLabel}</div>
                        <span class="status-tag ${statusClass}">${statusLabel}</span>
                    </div>
                `;
            }

            todayListEl.innerHTML = html;
        }

        // 7.2 渲染所有课程（表格 + 筛选 + 星期汇总）
        function renderAll() {
            const week = getCurrentWeek();

            // 收集所有筛选选项

            const subjectSet = new Set();

            for (const c of allCourses) {
                teacherSet.add(c.teacher);
                buildingSet.add(c.building);
                subjectSet.add(c.subject);

                [...buildingSet].sort().map(b => `<option value="${b}">${b}</option>`).join('');

                [...subjectSet].sort().map(s => `<option value="${s}">${s}</option>`).join('');

            filterTeacherEl.value = filterTeacher;
            filterBuildingEl.value = filterBuilding;
            filterSubjectEl.value = filterSubject;

            // 筛选课程列表
            let filtered = allCourses.filter(c => {
                if (filterTeacher && c.teacher !== filterTeacher) return false;
                if (filterBuilding && c.building !== filterBuilding) return false;
                if (filterSubject && c.subject !== filterSubject) return false;
                return true;
            });

            filtered.sort((a, b) => {
                if (a.day !== b.day) return a.day - b.day;
                return timeToMin(a.start) - timeToMin(b.start);
            });

            totalCountEl.textContent = filtered.length;

            // 渲染列表表格
            if (filtered.length === 0) {
                allBodyEl.innerHTML = `
                    <tr><td colspan="6" class="empty-state">没有匹配的课程</td></tr>

                let html = '';
                for (const c of filtered) {

                allBodyEl.innerHTML = html;

            // 渲染星期汇总（全部课程，不受筛选影响）
            renderWeekSummary();

        // 7.3 渲染星期汇总表格
        function renderWeekSummary() {
            const groups = {};
            for (let i = 1; i <= 7; i++) groups[i] = [];
            for (const c of allCourses) {
                groups[c.day].push(c);
            }

            for (let i = 1; i <= 7; i++) {
                groups[i].sort((a, b) => timeToMin(a.start) - timeToMin(b.start));
            }

            let html = `<table>
                <thead><tr><th>星期</th><th>课程安排</th></tr></thead>
                <tbody>`;
            for (let i = 1; i <= 7; i++) {
                const dayCourses = groups[i];
                const dayName = '周' + dayNames[i % 7];
                html += `<tr><td class="day-cell">${dayName}</td><td>`;
                if (dayCourses.length === 0) {
                    html += `<span class="empty-day">（无课程）</span>`;
                } else {
                    for (const c of dayCourses) {
                        html += `<span class="course-item">
                            <span class="time">${c.timeLabel}</span>
                            <span class="info">${c.name} · ${c.teacher} · ${c.building}</span>
                        </span>`;
                    }
                }
                html += `</td></tr>`;
            }
            html += `</tbody></table>`;

            setUserName(newName);
            const newKey = apiKeyInput.value.trim();
            setApiKey(newKey);
            settingsOverlay.classList.remove('open');
            generateAiSuggestion();
        });
        settingsOverlay.addEventListener('click', (e) => {
            if (e.target === settingsOverlay) {
                settingsOverlay.classList.remove('open');
            }
        });

        generateAiBtn.addEventListener('click', async () => {
            const key = apiKeyInput.value.trim();
            if (key) {
                setApiKey(key);
            }
            await generateAiSuggestion();
            updateApiStatus();
        });

        // 导出数据到本地 JSON 文件
        exportDataBtn.addEventListener('click', () => {
            const data = {
                exportedAt: new Date().toISOString(),
                userName: getUserName(),
                apiKey: getApiKey() ? '***已设置***' : '',
                courses: rawCourses, // 原始课程数据
                semesterInfo: {
                    semester: '2026-2027学年秋（三学期）',
                    startDate: '2026-08-31',
                }
            };
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `课表数据_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            // 简单反馈
            const origText = exportDataBtn.textContent;
            exportDataBtn.textContent = '✅ 已导出';
            setTimeout(() => { exportDataBtn.textContent = origText; }, 2000);
        });

        // =====================================================
        //  9. 启动
        // =====================================================

        updateGreeting();
        updateApiStatus();
        switchTab('today');
        setTimeout(() => generateAiSuggestion(), 500);

        setInterval(() => {
            if (currentTab === 'today') {
                renderToday();
            }
            updateGreeting();
            const now = new Date();
            if (now.getMinutes() === 0) {
                generateAiSuggestion();
            }
        }, 30000);

        console.log('📘 26光电2班 课程表已加载 (含导出数据)');
        console.log(`📅 当前周次: ${getCurrentWeek()}, 星期${dayNames[getCurrentDay() % 7]}`);
        console.log(`📚 共 ${allCourses.length} 条课程记录`);
    </script>

</body>
</html>
